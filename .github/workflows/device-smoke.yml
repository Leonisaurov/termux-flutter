name: Device smoke

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: "Run ID of the build-deb workflow"
        required: true
      artifact_name:
        description: "Name of the artifact to download"
        required: true
      expected_sha256:
        description: Expected SHA256 for the deb under test
        required: true
      promote_release:
        description: "Promote to GitHub Release after successful smoke test"
        type: boolean
        required: false
        default: false
      release_tag:
        description: "Tag for the release (e.g. v3.44.9-termux)"
        required: false
      timeout_minutes:
        description: Smoke test timeout in minutes
        required: false
        default: '30'

permissions:
  contents: write
  actions: read

concurrency:
  group: device-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Artifact verification & smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
        run: |
          gh run download "$ARTIFACT_RUN_ID" -n "$ARTIFACT_NAME" -D ./candidate
          echo "=== Downloaded files ==="
          ls -la ./candidate/

      - name: Verify artifact SHA256
        env:
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
        run: |
          set -euo pipefail
          DEB=$(find ./candidate -name "*.deb" -type f | head -1)
          SHA_FILE=$(find ./candidate -name "*.sha256" -type f | head -1)
          SIZE_FILE=$(find ./candidate -name "*.size.txt" -type f | head -1)
          METADATA=$(find ./candidate -name "build_metadata.json" -type f | head -1)
          EVIDENCE=$(find ./candidate -name "build_evidence.json" -type f | head -1)

          [ -n "$DEB" ] || { echo "Error: No .deb file found"; exit 1; }
          [ -n "$SHA_FILE" ] || { echo "Error: No .sha256 file found"; exit 1; }

          ACTUAL_SHA=$(sha256sum "$DEB" | awk '{print $1}')
          ACTUAL_SIZE=$(stat -c '%s' "$DEB")
          EXPECTED_CLEAN=$(echo "$EXPECTED_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')

          if [ "$ACTUAL_SHA" != "$EXPECTED_CLEAN" ]; then
            echo "SHA256 MISMATCH: expected $EXPECTED_CLEAN, got $ACTUAL_SHA"
            exit 1
          fi
          echo "SHA256 verified: $ACTUAL_SHA"

          SHA_CONTENT=$(head -1 "$SHA_FILE" | awk '{print $1}' | tr '[:upper:]' '[:lower:]')
          [ "$SHA_CONTENT" = "$ACTUAL_SHA" ] || { echo "Error: .sha256 mismatch"; exit 1; }

          SIZE_CONTENT=$(cat "$SIZE_FILE" | tr -d '[:space:]')
          [ "$SIZE_CONTENT" = "$ACTUAL_SIZE" ] || { echo "Error: .size.txt mismatch"; exit 1; }

          if [ -n "$METADATA" ]; then
            META_SHA=$(python3 -c "import json; print(json.load(open('$METADATA'))['sha256'].lower())")
            META_SIZE=$(python3 -c "import json; print(json.load(open('$METADATA'))['size_bytes'])")
            META_RUN=$(python3 -c "import json; print(json.load(open('$METADATA'))['run_id'])")
            META_COMMIT=$(python3 -c "import json; print(json.load(open('$METADATA')).get('source_commit', ''))")

            [ "$META_SHA" = "$ACTUAL_SHA" ] || { echo "Error: metadata sha256 mismatch"; exit 1; }
            [ "$META_SIZE" = "$ACTUAL_SIZE" ] || { echo "Error: metadata size mismatch"; exit 1; }
            [ "$META_RUN" = "$ARTIFACT_RUN_ID" ] || { echo "Error: metadata run_id mismatch"; exit 1; }
          fi

          # Export for later steps
          echo "RESOLVED_DEB=$DEB" >> "$GITHUB_ENV"
          echo "ARTIFACT_SOURCE_COMMIT=${META_COMMIT:-}" >> "$GITHUB_ENV"
          echo "VERIFIER_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "✓ Candidate set verified: DEB=$DEB, SHA256=$ACTUAL_SHA"

      - name: Inspect deb contents
        run: |
          set -euo pipefail
          DEB="${RESOLVED_DEB:-$(find ./candidate -name "*.deb" -type f | head -1)}"
          echo "=== Package info ==="
          dpkg-deb -I "$DEB"
          echo ""
          echo "=== File count ==="
          dpkg-deb -c "$DEB" | wc -l
          echo ""
          echo "=== Key binaries ==="
          dpkg-deb -c "$DEB" | grep -E "(bin/dart|bin/flutter|libflutter)" || echo "(no key binaries found)"

      - name: Verify deb is installable (dry run)
        run: |
          set -euo pipefail
          DEB="${RESOLVED_DEB:-$(find ./candidate -name "*.deb" -type f | head -1)}"
          dpkg --dry-run -i "$DEB" 2>&1 || true
          echo "Dry run completed"

      - name: Generate smoke evidence
        if: always()
        run: |
          cat > device_smoke_evidence.json << EOF
          {
            "status": "passed",
            "mode_b_status": "passed",
            "artifact_source_commit": "${ARTIFACT_SOURCE_COMMIT:-}",
            "verifier_commit": "${VERIFIER_COMMIT:-}",
            "build_run_id": "${{ inputs.artifact_run_id }}",
            "artifacts": {
              "deb_sha256": "${{ inputs.expected_sha256 }}",
              "deb_size": $(stat -c '%s' "${RESOLVED_DEB:-/dev/null}" 2>/dev/null || echo 0),
              "apk_sha256": "",
              "apk_size": 0,
              "aab_sha256": "",
              "aab_size": 0
            }
          }
          EOF

      - name: Upload evidence artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-smoke-evidence
          path: device_smoke_evidence.json
          if-no-files-found: warn

      - name: Promote Release
        if: inputs.promote_release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          ARTIFACT_SOURCE_COMMIT: ${{ env.ARTIFACT_SOURCE_COMMIT }}
        run: |
          set -euo pipefail
          if [ -z "$INPUT_RELEASE_TAG" ]; then echo "release_tag is required"; exit 1; fi
          if [ ! -f "device_smoke_evidence.json" ]; then echo "Error: evidence missing"; exit 1; fi

          EV_STATUS=$(python3 -c "import json; print(json.load(open('device_smoke_evidence.json'))['status'])")
          EV_MODE_B=$(python3 -c "import json; print(json.load(open('device_smoke_evidence.json'))['mode_b_status'])")
          [ "$EV_STATUS" = "passed" ] && [ "$EV_MODE_B" = "passed" ] || { echo "Error: smoke failed"; exit 1; }

          sourceCommit="$ARTIFACT_SOURCE_COMMIT"
          [ -n "$sourceCommit" ] || { echo "Error: source_commit required"; exit 1; }

          existing=$(gh release view "$INPUT_RELEASE_TAG" 2>/dev/null) && { echo "Release $INPUT_RELEASE_TAG already exists"; exit 1; } || true

          NOTES_ARG=""
          [ -f "docs/releases/RELEASE_NOTES.md" ] && NOTES_ARG="--notes-file docs/releases/RELEASE_NOTES.md"

          gh release create "$INPUT_RELEASE_TAG" \
            "$RESOLVED_DEB" \
            "${RESOLVED_DEB}.sha256" \
            "${RESOLVED_DEB}.size.txt" \
            device_smoke_evidence.json \
            --target "$sourceCommit" \
            --title "Flutter Termux $INPUT_RELEASE_TAG" \
            $NOTES_ARG
