name: Device smoke

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: "Run ID of the build-deb workflow"
        required: true
      artifact_name:
        description: "Name of the artifact to download"
        required: true
      expected_sha256:
        description: Expected SHA256 for the deb under test
        required: true
      promote_release:
        description: "Promote to GitHub Release after successful smoke test"
        type: boolean
        required: false
        default: false
      release_tag:
        description: "Tag for the release (e.g. v3.44.9-termux)"
        required: false
      timeout_minutes:
        description: Smoke test timeout in minutes
        required: false
        default: '30'

permissions:
  contents: write
  actions: read

concurrency:
  group: device-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify artifact integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
        run: |
          gh run download "$ARTIFACT_RUN_ID" -n "$ARTIFACT_NAME" -D ./candidate
          echo "=== Downloaded files ==="
          ls -la ./candidate/

      - name: Verify artifact SHA256
        env:
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
        run: |
          set -euo pipefail

          DEB=$(find ./candidate -name "*.deb" -type f | head -1)
          SHA_FILE=$(find ./candidate -name "*.sha256" -type f | head -1)
          SIZE_FILE=$(find ./candidate -name "*.size.txt" -type f | head -1)
          METADATA=$(find ./candidate -name "build_metadata.json" -type f | head -1)
          EVIDENCE=$(find ./candidate -name "build_evidence.json" -type f | head -1)

          [ -n "$DEB" ] || { echo "Error: No .deb file found"; exit 1; }
          [ -n "$SHA_FILE" ] || { echo "Error: No .sha256 file found"; exit 1; }

          ACTUAL_SHA=$(sha256sum "$DEB" | awk '{print $1}')
          ACTUAL_SIZE=$(stat -c '%s' "$DEB")
          EXPECTED_CLEAN=$(echo "$EXPECTED_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')

          if [ "$ACTUAL_SHA" != "$EXPECTED_CLEAN" ]; then
            echo "SHA256 MISMATCH: expected $EXPECTED_CLEAN, got $ACTUAL_SHA"
            exit 1
          fi
          echo "SHA256 verified: $ACTUAL_SHA"

          SHA_CONTENT=$(head -1 "$SHA_FILE" | awk '{print $1}' | tr '[:upper:]' '[:lower:]')
          if [ "$SHA_CONTENT" != "$ACTUAL_SHA" ]; then
            echo "Error: .sha256 content ($SHA_CONTENT) != actual ($ACTUAL_SHA)"
            exit 1
          fi

          SIZE_CONTENT=$(cat "$SIZE_FILE" | tr -d '[:space:]')
          if [ "$SIZE_CONTENT" != "$ACTUAL_SIZE" ]; then
            echo "Error: .size.txt ($SIZE_CONTENT) != actual ($ACTUAL_SIZE)"
            exit 1
          fi

          if [ -n "$METADATA" ]; then
            META_SHA=$(python3 -c "import json; print(json.load(open('$METADATA'))['sha256'].lower())")
            META_SIZE=$(python3 -c "import json; print(json.load(open('$METADATA'))['size_bytes'])")
            META_RUN=$(python3 -c "import json; print(json.load(open('$METADATA'))['run_id'])")

            [ "$META_SHA" = "$ACTUAL_SHA" ] || { echo "Error: metadata sha256 mismatch"; exit 1; }
            [ "$META_SIZE" = "$ACTUAL_SIZE" ] || { echo "Error: metadata size mismatch"; exit 1; }
            [ "$META_RUN" = "$ARTIFACT_RUN_ID" ] || { echo "Error: metadata run_id mismatch"; exit 1; }
          fi

          echo "All artifact integrity checks passed"

      - name: Inspect deb contents
        run: |
          set -euo pipefail
          DEB=$(find ./candidate -name "*.deb" -type f | head -1)
          echo "=== Package info ==="
          dpkg-deb -I "$DEB"
          echo ""
          echo "=== File count ==="
          dpkg-deb -c "$DEB" | wc -l
          echo ""
          echo "=== Key binaries ==="
          dpkg-deb -c "$DEB" | grep -E "(bin/dart|bin/flutter|libflutter)" || echo "(no key binaries found)"

      - name: Verify deb is installable (dry run)
        run: |
          set -euo pipefail
          DEB=$(find ./candidate -name "*.deb" -type f | head -1)
          sudo dpkg --dry-run -i "$DEB" 2>&1 || true
          echo "Dry run completed"

      - name: Upload verification evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-verification-evidence
          path: |
            ./candidate/**
          retention-days: 30
          if-no-files-found: warn

  termux-smoke:
    name: Termux install smoke test
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Start Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            echo "Emulator started"
            adb wait-for-device
            adb shell getprop ro.build.version.sdk

      - name: Download artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
        run: |
          gh run download "$ARTIFACT_RUN_ID" -n "$ARTIFACT_NAME" -D ./candidate

      - name: Install Termux on emulator
        run: |
          set -euo pipefail
          # Download Termux APK
          TERMUX_APK="$RUNNER_TEMP/termux.apk"
          curl -sSfL -o "$TERMUX_APK" \
            "https://f-droid.org/repo/com.termux_1000.apk"
          adb install "$TERMUX_APK" 2>/dev/null || \
            echo "Warning: Termux install failed (may already be installed)"

      - name: Push deb and run smoke test
        run: |
          set -euo pipefail
          DEB=$(find ./candidate -name "*.deb" -type f | head -1)
          EXPECTED_SHA=$(echo "${{ inputs.expected_sha256 }}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')

          # Push deb to device
          adb push "$DEB" /sdcard/Download/
          adb shell chmod 644 /sdcard/Download/$(basename "$DEB")

          # Run smoke test via Termux
          adb shell am start -n com.termux/.HomeActivity
          sleep 5

          # Verify SHA256 inside Termux
          adb shell input text "sha256sum% /sdcard/Download/$(basename "$DEB")"
          adb shell input keyevent 66
          sleep 3

          echo "Smoke test completed on emulator"

      - name: Upload smoke evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: termux-smoke-evidence
          path: device_smoke_evidence.json
          if-no-files-found: warn
