name: Build deb

on:
  workflow_dispatch:
    inputs:
      flutter_version:
        description: Flutter version to build (must match build.toml tag)
        required: false
      arch:
        description: Target architecture
        required: true
        default: arm64
        type: choice
        options:
          - arm64
      force:
        description: Force full rebuild (ignore caches)
        required: false
        type: boolean
        default: false
      runner:
        description: Runner to use
        required: true
        default: ubuntu-latest
        type: choice
        options:
          - ubuntu-latest
          - ubuntu-latest-4-cores
          - ubuntu-latest-8-cores

permissions:
  contents: write
  actions: read

concurrency:
  group: build-deb-${{ github.ref }}-${{ inputs.arch }}
  cancel-in-progress: false

jobs:
  build:
    name: Full Flutter/Termux deb build
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 350

    env:
      ARCH: ${{ inputs.arch }}
      DEPOT_DIR: ${{ github.workspace }}/depot_tools
      ENGINE_ROOT: ${{ github.workspace }}/engine
      ANDROID_HOME: ${{ github.workspace }}/android-sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          echo "=== Disk before ==="
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          docker image prune -af 2>/dev/null || true
          sudo apt-get clean
          echo "=== Disk after ==="
          df -h /

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl git python3 pkg-config libgtk-3-dev \
            ninja-build cmake clang lld

      - name: Cache depot_tools
        id: cache-depot
        uses: actions/cache@v4
        with:
          path: ${{ env.DEPOT_DIR }}
          key: depot-tools-${{ runner.os }}

      - name: Ensure depot_tools is available
        if: steps.cache-depot.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$DEPOT_DIR"

      - name: Add depot_tools to PATH
        run: echo "$DEPOT_DIR" >> "$GITHUB_PATH"

      - name: Cache engine source
        id: cache-engine
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ENGINE_ROOT }}
            ~/.gcloud-gce-linux-sdk
          key: engine-src-${{ hashFiles('build.toml') }}-${{ github.sha }}
          restore-keys: |
            engine-src-${{ hashFiles('build.toml') }}-
            engine-src-

      - name: Cache sysroot
        id: cache-sysroot
        uses: actions/cache@v4
        with:
          path: sysroot
          key: sysroot-${{ hashFiles('build.toml') }}-${{ github.sha }}
          restore-keys: |
            sysroot-${{ hashFiles('build.toml') }}-
            sysroot-

      - name: Cache build artifacts
        id: cache-build
        uses: actions/cache@v4
        with:
          path: |
            engine/src/out
            engine/.gclient
          key: build-${{ hashFiles('build.toml') }}-${{ github.sha }}
          restore-keys: |
            build-${{ hashFiles('build.toml') }}-
            build-

      - name: Validate host toolchain contract
        shell: bash
        env:
          INPUT_FLUTTER_VERSION: ${{ inputs.flutter_version }}
          ANDROID_HOME: ${{ github.workspace }}/android-sdk
        run: |
          set -euo pipefail
          NDK_DIR="${NDK_PATH:-${ANDROID_NDK:-${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}}}"
          if [ -z "$NDK_DIR" ] || [ ! -d "$NDK_DIR" ]; then
            TOML_NDK=$(python3 -c "import tomllib; print(tomllib.load(open('build.toml', 'rb')).get('ndk', {}).get('path', '') or '')" 2>/dev/null || true)
            if [ -n "$TOML_NDK" ] && [ -d "$TOML_NDK" ]; then
              NDK_DIR="$TOML_NDK"
            fi
          fi
          if [ -z "$NDK_DIR" ] || [ ! -d "$NDK_DIR" ]; then
            echo "NDK not found, installing via sdkmanager..."
            ANDROID_SDK_ROOT="$ANDROID_HOME"
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
            if [ ! -d "$ANDROID_SDK_ROOT/cmdline-tools/latest" ]; then
              curl -sSfL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
              unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
              mv /tmp/cmdtools/cmdline-tools "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            fi
            yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" "ndk;27.2.12479018" 2>/dev/null || true
            NDK_DIR="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          fi
          if [ ! -f "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" ]; then
            echo "Error: NDK at '$NDK_DIR' missing expected toolchain" >&2
            exit 1
          fi
          echo "NDK_PATH=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          INPUT_VERSION="$INPUT_FLUTTER_VERSION"
          TOML_VERSION=$(grep '^tag *=' build.toml | sed -E "s/tag *= *'([^']+)'/\1/")
          if [ -z "$TOML_VERSION" ]; then
            echo "Failed to parse flutter version from build.toml" >&2
            exit 1
          fi
          if [ -n "$INPUT_VERSION" ] && [ "$INPUT_VERSION" != "$TOML_VERSION" ]; then
            echo "Error: input flutter_version ($INPUT_VERSION) != build.toml tag ($TOML_VERSION)" >&2
            exit 1
          fi
          VERSION="${INPUT_VERSION:-$TOML_VERSION}"
          echo "FLUTTER_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          python -m py_compile build.py package.py sysroot.py utils.py
          bash -n scripts/install/post_install.sh
          python scripts/ci/check_repo.py

      - name: Build all artifacts
        run: |
          EXTRA_ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then
            EXTRA_ARGS="--force"
          fi
          python build.py build_all --arch="$ARCH" $EXTRA_ARGS

      - name: Collect artifact metadata
        id: artifact
        shell: bash
        run: |
          DEB=$(python -c "import build; print(build.Build().output('$ARCH'))")
          test -f "$DEB"
          sha256sum "$DEB" | tee "${DEB}.sha256"
          stat -c '%s' "$DEB" | tee "${DEB}.size.txt"
          echo "deb=$DEB" >> "$GITHUB_OUTPUT"

      - name: Generate build metadata
        id: metadata
        shell: bash
        run: |
          DEB="${{ steps.artifact.outputs.deb }}"
          METADATA_FILE="build_metadata.json"
          EVIDENCE_FILE="build_evidence.json"
          TZ=UTC dpkg-deb -c "$DEB" > inventory.txt
          TREE_SHA=$(git log -1 --format='%T' HEAD)
          NOW_EPOCH=$(date +%s)
          START_EPOCH="${BUILD_START_EPOCH:-$NOW_EPOCH}"
          BUILD_DURATION=$((NOW_EPOCH - START_EPOCH))
          cat <<EOF > "$METADATA_FILE"
          {
            "version": "${FLUTTER_VERSION}",
            "arch": "${ARCH}",
            "run_id": "${{ github.run_id }}",
            "build_number": "${{ github.run_number }}",
            "source_commit": "${{ github.sha }}",
            "tree_sha": "${TREE_SHA}",
            "sha256": "$(cat ${DEB}.sha256 | awk '{print $1}')",
            "size_bytes": $(stat -c '%s' "$DEB"),
            "build_duration_seconds": ${BUILD_DURATION}
          }
          EOF
          INVENTORY_COUNT=$(wc -l < inventory.txt)
          cat <<EOF > "$EVIDENCE_FILE"
          {
            "type": "build_evidence",
            "version": "${FLUTTER_VERSION}",
            "arch": "${ARCH}",
            "run_id": "${{ github.run_id }}",
            "build_number": "${{ github.run_number }}",
            "source_commit": "${{ github.sha }}",
            "tree_sha": "${TREE_SHA}",
            "deb_sha256": "$(cat ${DEB}.sha256 | awk '{print $1}')",
            "deb_size_bytes": $(stat -c '%s' "$DEB"),
            "inventory_file_count": ${INVENTORY_COUNT},
            "build_duration_seconds": ${BUILD_DURATION}
          }
          EOF
          echo "metadata=$METADATA_FILE" >> "$GITHUB_OUTPUT"
          echo "evidence=$EVIDENCE_FILE" >> "$GITHUB_OUTPUT"
          echo "inventory=inventory.txt" >> "$GITHUB_OUTPUT"

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-termux-${{ env.FLUTTER_VERSION }}-${{ inputs.arch }}
          path: |
            ${{ steps.artifact.outputs.deb }}
            ${{ steps.artifact.outputs.deb }}.sha256
            ${{ steps.artifact.outputs.deb }}.size.txt
            ${{ steps.metadata.outputs.metadata }}
            ${{ steps.metadata.outputs.inventory }}
            build_evidence.json
          retention-days: 90
          if-no-files-found: error
