[flutter]
tag = '3.47.2'
release_tag = 'v3.47.2-termux'
revision = '0'
dart_version = '3.13.2'
engine_commit = 'a804b261645ef8c13eb3d5c44a5c2fb0340c5539'
framework_revision = 'd3b14c876900e553bc736ca19295fc09e3853e8e'
framework_commit_date = '2026-08-26 23:07:51 +0000'
devtools_version = '2.42.0'
sha256 = ''
size = 0
asset_name = 'flutter_3.47.2_aarch64.deb'
repo = 'https://github.com/flutter/flutter'
path = './flutter'

[ndk]
api = 35 # Android 16 = API 35
path = ''

[build]
arch = ['arm64'] # arm, arm64, x86, x64
runtime = ['debug'] # debug, release, profile
gclient = './.gclient'
root = './engine'
release = './release'
jobs = 24  # Ryzen 9950X3D: 32 threads, leave 8 for system

# Windows to WSL sync paths (for debuild)
[sync]
windows_root = ''
wsl_root = ''
paths = ['scripts', 'patches', 'package.yaml', 'build.toml', 'build.py', 'sysroot.py', 'package.py', 'utils.py', '.gclient', 'install_flutter_complete.sh', 'sysroot.lock.json']

# Patches are now version-based: patches/{version}/*.patch
# build.py will automatically look for patches in patches/{flutter.tag}/
[patch]
dir = './patches'  # Base directory for patches

[patch.engine]
file = 'engine.patch'
path = '.'

[patch.dart]
file = 'dart.patch'
path = 'engine/src/flutter/third_party/dart'

[patch.skia]
file = 'skia.patch'
path = 'engine/src/flutter/third_party/skia'

[patch.flutter_sdk]
file = 'flutter_sdk_arm64_default.patch'
path = '.'

[sysroot]
path = './sysroot'

[sysroot.termux-main]
repo = 'https://packages-cf.termux.dev/apt/termux-main/'
dist = 'stable'
pkgs = [
  'at-spi2-core', 'brotli', 'dbus', 'fontconfig', 'freetype', 'fribidi',
  'gdk-pixbuf', 'glib', 'harfbuzz', 'libcairo', 'libepoxy', 'libexpat',
  'libffi', 'libglvnd', 'libgraphite', 'libjpeg-turbo', 'liblzma',
  'libpixman', 'libpng', 'libtiff', 'libwayland', 'libx11', 'libxau',
  'libxcb', 'libxcursor', 'libxdmcp', 'libxext', 'libxfixes', 'libxft',
  'libxi', 'libxrandr', 'libxrender', 'libxtst', 'pango', 'pcre2',
  'swiftshader', 'xorgproto', 'zlib', 'zstd',
]

[sysroot.termux-x11]
repo = 'https://packages-cf.termux.dev/apt/termux-x11/'
dist = 'x11'
pkgs = [
  'gtk3', 'libxcomposite', 'libxdamage', 'libxinerama', 'libxkbcommon',
]

[package]
conf = './package.yaml'
path = '.'
